<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0369a1"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="32" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Stop-and-Wait ARQ (ideal channel)</text>
  <rect x="48" y="72" width="120" height="56" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="108" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#134e4a">Sender</text>
  <rect x="552" y="72" width="120" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="612" y="106" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#0c4a6e">Receiver</text>
  <line x1="168" y1="92" x2="540" y2="92" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="354" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#115e59">DATA (seq)</text>
  <line x1="540" y1="130" x2="168" y2="130" stroke="#0369a1" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="354" y="148" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#075985">ACK (seq)</text>
  <text x="360" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#475569">Only one unacknowledged DATA on the link at a time.</text>
  <text x="360" y="212" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#475569">Then the next frame may be sent.</text>
  <rect x="120" y="232" width="480" height="44" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="360" y="258" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11" fill="#64748b">seq  {0,1}  ·  ideal channel (no loss / no corruption)</text>
</svg>
