<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="32" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">IPv4 CIDR subnet</text>
  <circle cx="360" cy="160" r="88" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
  <text x="360" y="150" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#0c4a6e">Network</text>
  <text x="360" y="170" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#0369a1">prefix /n</text>
  <text x="360" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#075985">hosts in subnet, broadcast at end</text>
  <rect x="48" y="96" width="200" height="72" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="148" y="120" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#334155">From address + mask</text>
  <text x="148" y="142" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">network, first host</text>
  <text x="148" y="158" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">last host, broadcast</text>
  <rect x="472" y="96" width="200" height="72" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="572" y="126" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#334155">ipaddress module</text>
  <text x="572" y="150" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">IPv4Network(cidr)</text>
</svg>
