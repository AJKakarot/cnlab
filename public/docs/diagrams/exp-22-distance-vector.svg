<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-hidden="true">
  <rect width="720" height="280" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Distance-vector exchange</text>
  <circle cx="200" cy="130" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="200" y="136" text-anchor="middle" font-weight="700" fill="#0369a1">R1</text>
  <circle cx="520" cy="130" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="520" y="136" text-anchor="middle" font-weight="700" fill="#0369a1">R2</text>
  <line x1="230" y1="130" x2="488" y2="130" stroke="#64748b" stroke-width="2"/>
