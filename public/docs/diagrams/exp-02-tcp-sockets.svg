  <text x="126" y="98" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#4c1d95">Server</text>
  <text x="126" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#6b21a8">bind · listen</text>
  <text x="126" y="136" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#6b21a8">accept ’ conn</text>
