<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Hamming (7,4) codeword positions</text>
  <g font-family="ui-monospace,monospace" font-size="13" font-weight="600">
    <rect x="110" y="100" width="72" height="44" rx="6" fill="#fef08a" stroke="#ca8a04"/><text x="146" y="128" text-anchor="middle" fill="#713f12">P1</text>
    <rect x="192" y="100" width="72" height="44" rx="6" fill="#fef08a" stroke="#ca8a04"/><text x="228" y="128" text-anchor="middle" fill="#713f12">P2</text>
    <rect x="274" y="100" width="72" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="310" y="128" text-anchor="middle" fill="#1e40af">D1</text>
    <rect x="356" y="100" width="72" height="44" rx="6" fill="#fef08a" stroke="#ca8a04"/><text x="392" y="128" text-anchor="middle" fill="#713f12">P4</text>
    <rect x="438" y="100" width="72" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="474" y="128" text-anchor="middle" fill="#1e40af">D2</text>
    <rect x="520" y="100" width="72" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="556" y="128" text-anchor="middle" fill="#1e40af">D3</text>
    <rect x="602" y="100" width="72" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="638" y="128" text-anchor="middle" fill="#1e40af">D4</text>
  </g>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#64748b">
    <text x="146" y="92" text-anchor="middle">pos 1</text>
    <text x="228" y="92" text-anchor="middle">2</text>
    <text x="310" y="92" text-anchor="middle">3</text>
    <text x="392" y="92" text-anchor="middle">4</text>
    <text x="474" y="92" text-anchor="middle">5</text>
    <text x="556" y="92" text-anchor="middle">6</text>
    <text x="638" y="92" text-anchor="middle">7</text>
  </g>
  <text x="360" y="210" text-anchor="middle" font-size="11" fill="#475569">Parity bits sit at powers of two; syndrome locates a single flipped bit.</text>
</svg>
