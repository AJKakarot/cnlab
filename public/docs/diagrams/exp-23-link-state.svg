<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-hidden="true">
  <rect width="720" height="280" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Link-state: flood then SPF</text>
  <rect x="80" y="70" width="160" height="100" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="160" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">1. Flood LSAs</text>
  <text x="160" y="135" text-anchor="middle" font-size="10" fill="#047857">same topology DB</text>
  <text x="160" y="155" text-anchor="middle" font-size="10" fill="#047857">at every router</text>
  <polygon points="250,120 310,120 280,90" fill="#cbd5e1"/>
  <rect x="320" y="70" width="160" height="100" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="400" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">2. Dijkstra SPF</text>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#4338ca">local shortest paths</text>
  <rect x="520" y="70" width="140" height="100" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="590" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">3. FIB</text>
  <text x="590" y="142" text-anchor="middle" font-size="10" fill="#c2410c">next-hop table</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#475569">OSPF family uses link-state; run dijkstra in repo: routing_algorithms_lab.py dijkstra</text>
</svg>
