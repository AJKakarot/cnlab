<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-hidden="true">
  <rect width="720" height="320" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Ping &amp; traceroute (concept)</text>
  <text x="80" y="70" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#0c4a6e">Ping</text>
  <circle cx="100" cy="110" r="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="100" y="116" text-anchor="middle" font-size="10" font-weight="600" fill="#0369a1">H</text>
  <line x1="130" y1="110" x2="560" y2="110" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 4"/>
  <polygon points="560,110 548,104 548,116" fill="#0284c7"/>
  <text x="340" y="102" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0369a1">ICMP Echo Request</text>
  <line x1="560" y1="130" x2="130" y2="130" stroke="#0d9488" stroke-width="2" stroke-dasharray="8 4"/>
  <polygon points="130,130 142,124 142,136" fill="#0d9488"/>
  <text x="340" y="148" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#0f766e">ICMP Echo Reply</text>
  <circle cx="580" cy="120" r="18" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="580" y="126" text-anchor="middle" font-size="10" font-weight="600" fill="#0f766e">D</text>
  <text x="80" y="188" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#9a3412">Traceroute</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" fill="#78716c">
    <rect x="100" y="200" width="70" height="32" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="135" y="220" text-anchor="middle">RÅ TTL=1</text>
    <rect x="220" y="200" width="70" height="32" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="255" y="220" text-anchor="middle">RÇ TTL=2</text>
    <rect x="340" y="200" width="70" height="32" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="375" y="220" text-anchor="middle">RÉ ∑∑∑</text>
    <rect x="520" y="200" width="90" height="32" rx="4" fill="#d1fae5" stroke="#059669"/>
    <text x="565" y="220" text-anchor="middle">Dest reply</text>
  </g>
  <text x="360" y="272" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#57534e">Each hop returns ICMP Time Exceeded until probe reaches the target.</text>
</svg>
