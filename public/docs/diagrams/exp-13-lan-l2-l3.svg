<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">LAN: L2 switch and L3 router</text>
  <rect x="60" y="70" width="88" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="104" y="100" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">PC1</text>
  <rect x="60" y="150" width="88" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="104" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">PC2</text>
  <rect x="220" y="96" width="100" height="80" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="270" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Switch</text>
  <text x="270" y="150" text-anchor="middle" font-size="9" fill="#64748b">MAC learn</text>
  <rect x="420" y="96" width="100" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="470" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Router</text>
  <text x="470" y="150" text-anchor="middle" font-size="9" fill="#b45309">IP subnets</text>
  <line x1="148" y1="94" x2="210" y2="120" stroke="#2563eb" stroke-width="2"/>
  <line x1="148" y1="174" x2="210" y2="152" stroke="#2563eb" stroke-width="2"/>
  <line x1="320" y1="136" x2="412" y2="136" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="136" x2="600" y2="136" stroke="#d97706" stroke-width="2"/>
  <text x="630" y="142" font-size="10" fill="#92400e">WAN / other LAN</text>
  <text x="360" y="260" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">Broadcast contained per vlan; router breaks broadcast domains.</text>
</svg>
