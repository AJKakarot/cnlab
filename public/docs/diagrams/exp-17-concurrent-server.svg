<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Concurrent TCP server</text>
  <rect x="260" y="52" width="200" height="56" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="360" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">Main thread: accept loop</text>
  <line x1="360" y1="108" x2="360" y2="132" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="132" x2="520" y2="132" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="132" x2="200" y2="152" stroke="#64748b" stroke-width="2"/>
  <line x1="360" y1="132" x2="360" y2="152" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="132" x2="520" y2="152" stroke="#64748b" stroke-width="2"/>
  <rect x="150" y="156" width="100" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="186" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Worker 1</text>
  <rect x="310" y="156" width="100" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="360" y="186" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Worker 2</text>
  <rect x="470" y="156" width="100" height="50" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="520" y="186" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Worker n</text>
  <text x="360" y="246" text-anchor="middle" font-size="11" fill="#475569">Each accept returns a new socket; thread handles that client while listener continues.</text>
</svg>
