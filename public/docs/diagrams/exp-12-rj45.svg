<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-hidden="true">
  <rect width="720" height="340" fill="#f8fafc" rx="8"/>
  <text x="360" y="32" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">RJ-45 straight-through (T568B)</text>
  <text x="360" y="54" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">Same order on both plugs for host-to-switch</text>
  <rect x="200" y="80" width="320" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="3"/>
  <g font-family="ui-monospace,monospace" font-size="9" fill="#e2e8f0">
    <text x="220" y="108">1  w-o</text><text x="220" y="128">2  orange</text>
    <text x="220" y="148">3  w-g</text><text x="220" y="168">4  blue</text>
    <text x="220" y="188">5  w-b</text><text x="220" y="208">6  green</text>
    <text x="220" y="228">7  w-br</text><text x="220" y="248">8  brown</text>
  </g>
  <text x="420" y="180" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">Pin 1</text>
  <text x="420" y="200" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">left when latch down,</text>
  <text x="420" y="218" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#94a3b8">contacts away</text>
  <text x="360" y="310" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#475569">Practice on scrap cable; verify with tester before production use.</text>
</svg>
