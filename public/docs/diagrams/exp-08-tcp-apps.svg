<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">TCP application patterns</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="48" y="56" width="200" height="76" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="148" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">(a) Echo</text>
    <text x="148" y="106" text-anchor="middle" font-size="10" fill="#1e40af">line in ’ same bytes out</text>
    <rect x="260" y="56" width="200" height="76" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="360" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#312e81">(b) Chat</text>
    <text x="360" y="106" text-anchor="middle" font-size="10" fill="#4338ca">lines both directions</text>
    <rect x="472" y="56" width="200" height="76" rx="8" fill="#cffafe" stroke="#0e7490" stroke-width="2"/>
    <text x="572" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#164e63">(c) File</text>
    <text x="572" y="106" text-anchor="middle" font-size="10" fill="#0e7490">bulk stream until close</text>
  </g>
  <rect x="120" y="168" width="480" height="100" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="360" y="200" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#334155">Common skeleton</text>
  <text x="360" y="228" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">server: socket · bind · listen · accept · loop(recv/send)</text>
  <text x="360" y="248" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#64748b">client: socket · connect · send/recv</text>
</svg>
