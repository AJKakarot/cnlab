<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-hidden="true">
  <rect width="720" height="280" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">UDP vs TCP (lab toys)</text>
  <rect x="80" y="56" width="240" height="100" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="200" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#854d0e">UDP</text>
  <text x="200" y="112" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#a16207">datagram: sendto / recvfrom</text>
  <text x="200" y="132" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#a16207">DNS-like, SNMP-like text</text>
  <rect x="400" y="56" width="240" height="100" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="86" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#14532d">TCP (Exp. 8)</text>
  <text x="520" y="112" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#15803d">byte stream, no msg boundary</text>
  <text x="520" y="132" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" fill="#15803d">echo, chat, file</text>
  <text x="360" y="210" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#475569">Production DNS/SNMP use binary encodings on UDP; this repo uses plain text for teaching.</text>
</svg>
