<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="30" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">CLI tools vs. layer</text>
  <rect x="280" y="48" width="160" height="36" rx="6" fill="#0f172a"/>
  <text x="360" y="72" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600">You (shell)</text>
  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="10">
    <rect x="80" y="110" width="120" height="40" rx="6" fill="#ccfbf1" stroke="#0d9488"/><text x="140" y="134" text-anchor="middle" fill="#115e59">ping / trace</text>
    <rect x="230" y="110" width="120" height="40" rx="6" fill="#cffafe" stroke="#0891b2"/><text x="290" y="134" text-anchor="middle" fill="#155e75">nslookup</text>
    <rect x="380" y="110" width="120" height="40" rx="6" fill="#e0e7ff" stroke="#4f46e5"/><text x="440" y="134" text-anchor="middle" fill="#3730a3">arp / ip neigh</text>
    <rect x="530" y="110" width="120" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="590" y="134" text-anchor="middle" fill="#9a3412">telnet / ftp</text>
  </g>
  <text x="140" y="200" text-anchor="middle" font-size="9" fill="#64748b">ICMP, IP</text>
  <text x="290" y="200" text-anchor="middle" font-size="9" fill="#64748b">DNS</text>
  <text x="440" y="200" text-anchor="middle" font-size="9" fill="#64748b">L2 cache</text>
  <text x="590" y="200" text-anchor="middle" font-size="9" fill="#64748b">TCP apps</text>
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#475569">Use institute-approved hosts only; cleartext tools for lab awareness.</text>
</svg>
