<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-hidden="true">
  <rect width="720" height="300" fill="#f8fafc" rx="8"/>
  <text x="360" y="32" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#0f172a">Sliding window (W = 4, example)</text>
  <text x="360" y="56" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#64748b">send_base ’ window ’ cumulative ACK slides left edge</text>
  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" font-weight="600">
    <rect x="80" y="96" width="44" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="102" y="124" text-anchor="middle" fill="#64748b">0</text>
    <rect x="132" y="96" width="44" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="154" y="124" text-anchor="middle" fill="#1e40af">1</text>
    <rect x="184" y="96" width="44" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="206" y="124" text-anchor="middle" fill="#1e40af">2</text>
    <rect x="236" y="96" width="44" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="258" y="124" text-anchor="middle" fill="#1e40af">3</text>
    <rect x="288" y="96" width="44" height="44" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text x="310" y="124" text-anchor="middle" fill="#1e40af">4</text>
    <rect x="340" y="96" width="44" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
