  <path d="M 124 168 L 312 168" stroke="#0f766e" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/></marker></defs>
  <text x="218" y="162" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#115e59">Multiple DATA on the channel</text>
  <text x="360" y="220" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#475569">ACK through k ’ slide window ’ may send new k+W</text>
